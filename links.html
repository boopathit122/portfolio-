<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Links | BOOPATHI THIURUTHANI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      color: white;

      background:
        radial-gradient(circle at 15% 15%,
        rgba(70,210,255,0.16),
        transparent 30%),

        radial-gradient(circle at 85% 80%,
        rgba(145,100,255,0.16),
        transparent 30%),

        linear-gradient(135deg, #040914, #091527);
    }

    .container {
      width: min(650px, 100%);
    }

    .card {
      padding: 35px;
      border-radius: 30px;

      background: rgba(255,255,255,0.07);

      border: 1px solid rgba(255,255,255,0.15);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow: 0 25px 70px rgba(0,0,0,0.35);

      text-align: center;
    }

    h1 {
      font-size: clamp(30px, 7vw, 48px);
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9eabbf;
      margin-bottom: 30px;
    }

    .link-box {
      text-align: left;

      margin-bottom: 18px;
      padding: 18px;

      border-radius: 20px;

      background: rgba(255,255,255,0.055);

      border: 1px solid rgba(255,255,255,0.13);
    }

    .label {
      color: #70ddff;

      font-size: 14px;

      font-weight: bold;

      margin-bottom: 10px;
    }

    code {
      display: block;

      padding: 14px;

      border-radius: 14px;

      background: rgba(0,0,0,0.28);

      border: 1px solid rgba(255,255,255,0.1);

      color: #dff5ff;

      word-break: break-all;

      font-size: 14px;

      margin-bottom: 12px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .glass-btn {
      flex: 1;

      min-width: 120px;

      min-height: 44px;

      padding: 11px 16px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      border-radius: 17px;

      color: white;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.12),
          rgba(255,255,255,0.04)
        );

      border: 1px solid rgba(255,255,255,0.17);

      backdrop-filter: blur(18px);

      -webkit-backdrop-filter: blur(18px);

      cursor: pointer;

      text-decoration: none;

      transition: 0.3s ease;
    }

    .glass-btn:hover {
      transform: translateY(-3px);

      background: rgba(255,255,255,0.16);

      border-color: rgba(112,221,255,0.5);
    }

    .message {
      color: #70ddff;

      font-size: 13px;

      margin-top: 8px;

      min-height: 18px;
    }

    .back {
      margin-top: 10px;
    }

    @media(max-width: 500px) {

      .card {
        padding: 22px;
      }

      .buttons {
        flex-direction: column;
      }

      .glass-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Contact Links</h1>

      <p class="subtitle">
        BOOPATHI THIURUTHANI
      </p>


      <!-- LINKEDIN -->

      <div class="link-box">

        <div class="label">
          LinkedIn
        </div>

        <code id="linkedin">
          https://www.linkedin.com/in/boopathithiruthani
        </code>

        <div class="buttons">

          <button
            class="glass-btn"
            onclick="copyText('linkedin','linkedinMessage')">
            Copy
          </button>

          <a
            class="glass-btn"
            href="https://www.linkedin.com/in/boopathithiruthani"
            target="_blank"
            rel="noopener">
            Open LinkedIn ↗
          </a>

        </div>

        <div
          id="linkedinMessage"
          class="message">
        </div>

      </div>


      <!-- EMAIL -->

      <div class="link-box">

        <div class="label">
          Email
        </div>

        <code id="email">
          boopathithiruthani@gmail.com
        </code>

        <div class="buttons">

          <button
            class="glass-btn"
            onclick="copyText('email','emailMessage')">
            Copy
          </button>

          <a
            class="glass-btn"
            href="mailto:boopathithiruthani@gmail.com">
            Open Email ↗
          </a>

        </div>

        <div
          id="emailMessage"
          class="message">
        </div>

      </div>


      <!-- BACK -->

      <a
        href="index.html"
        class="glass-btn back">
        ← Back to Portfolio
      </a>

    </div>

  </div>


  <script>

    function copyText(elementId, messageId) {

      const text =
        document
        .getElementById(elementId)
        .innerText
        .trim();

      navigator.clipboard
        .writeText(text)
        .then(function() {

          document
            .getElementById(messageId)
            .innerText =
            "Copied successfully ✓";

        })
        .catch(function() {

          document
            .getElementById(messageId)
            .innerText =
            "Copy failed. Please copy manually.";

        });
    }

  </script>

</body>
</html>
